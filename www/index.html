<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Emlak ve İnşaat</title>
<meta name="theme-color" content="#cfe3ea">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Layout: full-screen 3D şantiye, üstte kaynak şeridi, sağ altta market, altta açılan kart */
:root{
  --sky:#cfe3ea; --panel:#fffdf7; --ink:#1e2a2f; --muted:#5d6c72; --line:#e4ddcf;
  --mine:#1f6fd6; --muni:#d8741a; --gold:#c8961a; --ok:#2f8a4a; --bad:#b4442f; --lock:#4a5560;
  --f-display:"Fredoka","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
html,body{height:100%;overflow:hidden}
body{background:var(--sky);color:var(--ink);font-family:var(--f-body);-webkit-tap-highlight-color:transparent;user-select:none}
*{-webkit-user-select:none;user-select:none;-webkit-user-drag:none}
::selection{background:transparent}
input{-webkit-user-select:text;user-select:text}
#scene{position:fixed;inset:0;touch-action:none;cursor:grab}
#scene:active{cursor:grabbing}
#scene canvas{display:block}

.hud{position:fixed;top:0;left:0;right:0;z-index:5;padding-top:calc(env(safe-area-inset-top,0px) + 10px);
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));
  display:flex;gap:8px;align-items:flex-start;pointer-events:none}
.res{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;flex:1;pointer-events:auto}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px 8px;display:flex;align-items:center;gap:6px;min-width:0;box-shadow:0 2px 0 rgba(30,42,47,.08)}
.chip i{width:14px;height:14px;border-radius:4px;flex:none}
.chip .v{font:600 16px/1 var(--f-display);font-variant-numeric:tabular-nums}
.chip .l{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;display:block;line-height:1.1}
.chip div{min-width:0;overflow:hidden}
.i-odun{background:#8a5a33}.i-demir{background:#6f7d86}.i-altin{background:var(--gold)}.i-cimento{background:#b9b6ad}
.chip.flash{animation:flash .6s}
@keyframes flash{30%{background:#fff1c2;transform:scale(1.05)}}
.menu-btn{pointer-events:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;height:44px;padding:0 10px;font:700 12px var(--f-body);color:var(--muted)}
.menu-btn.warn{color:#fff;background:var(--bad);border-color:var(--bad)}

.market-btn{position:fixed;z-index:5;right:calc(env(safe-area-inset-right,0px) + 16px);bottom:calc(env(safe-area-inset-bottom,0px) + 16px);
  width:68px;height:68px;border-radius:20px;border:2px solid #fff;background:var(--ok);color:#fff;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font:600 12px var(--f-display);
  box-shadow:0 4px 0 #1f6233,0 8px 18px rgba(30,42,47,.25)}
.market-btn svg{width:30px;height:30px}
.army-btn{position:fixed;z-index:5;right:calc(env(safe-area-inset-right,0px) + 92px);bottom:calc(env(safe-area-inset-bottom,0px) + 16px);
  width:68px;height:68px;border-radius:20px;border:2px solid #fff;background:#b4442f;color:#fff;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font:600 11px var(--f-display);
  box-shadow:0 4px 0 #7d2d1f,0 8px 18px rgba(30,42,47,.25)}
.army-btn[hidden]{display:none}
.army-btn svg{width:28px;height:28px}
.army-btn:active{transform:translateY(2px);box-shadow:0 2px 0 #7d2d1f}
.market-btn:active{transform:translateY(2px);box-shadow:0 2px 0 #1f6233}
.world-btn{position:fixed;z-index:5;left:calc(env(safe-area-inset-left,0px) + 16px);bottom:calc(env(safe-area-inset-bottom,0px) + 16px);
  width:68px;height:68px;border-radius:20px;border:2px solid #fff;background:var(--mine);color:#fff;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font:600 12px var(--f-display);
  box-shadow:0 4px 0 #14498f,0 8px 18px rgba(30,42,47,.25)}
.world-btn svg{width:30px;height:30px}
.world-btn:active{transform:translateY(2px);box-shadow:0 2px 0 #14498f}
.world-btn:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.home-btn{position:fixed;z-index:5;left:calc(env(safe-area-inset-left,0px) + 94px);bottom:calc(env(safe-area-inset-bottom,0px) + 16px);
  width:68px;height:68px;border-radius:20px;border:2px solid #fff;background:var(--muni);color:#fff;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font:600 12px var(--f-display);
  box-shadow:0 4px 0 #a55a10,0 8px 18px rgba(30,42,47,.25)}
.home-btn[hidden]{display:none}
.home-btn svg{width:30px;height:30px}
.home-btn:active{transform:translateY(2px);box-shadow:0 2px 0 #a55a10}
.home-btn:focus-visible{outline:3px solid var(--ink);outline-offset:2px}

.hint{position:fixed;left:calc(env(safe-area-inset-left,0px) + 96px);bottom:calc(env(safe-area-inset-bottom,0px) + 28px);z-index:4;
  max-width:calc(100% - 200px);background:rgba(30,42,47,.78);color:#fff;font-size:13px;padding:8px 14px;border-radius:20px;pointer-events:none}

.sheet{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--panel);border-radius:20px 20px 0 0;border-top:1px solid var(--line);
  box-shadow:0 -8px 30px rgba(30,42,47,.18);max-height:66%;overflow-y:auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:10px calc(env(safe-area-inset-bottom,0px) + 18px);animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 10px}
.sh-head{display:flex;align-items:center;gap:10px}
.sh-head h2{font:600 22px/1.1 var(--f-display);margin:0;flex:1}
.close{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:20px;line-height:1;color:var(--muted)}
.tag{font:800 11px var(--f-body);letter-spacing:.06em;text-transform:uppercase;padding:4px 8px;border-radius:8px;color:#fff}
.tag.mine{background:var(--mine)}.tag.muni{background:var(--muni)}.tag.lock{background:var(--lock)}.tag.shop{background:var(--ok)}
dl.facts{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:14px 0 4px;font-size:15px}
dl.facts dt{color:var(--muted)} dl.facts dd{margin:0;font-weight:700}
.sec{font:800 11px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:16px 0 8px}
.opt{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.opt h3{margin:0;font:600 17px var(--f-display);display:flex;align-items:center;gap:8px}
.opt h3 i{width:14px;height:14px;border-radius:4px}
.cost{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12px;color:var(--muted);grid-column:1}
.cost span{display:inline-flex;align-items:center;gap:4px;font-variant-numeric:tabular-nums}
.cost i{width:9px;height:9px;border-radius:2px}
.cost .short{color:var(--bad);font-weight:800}
.earn{font-size:13px;color:var(--ok);font-weight:700;grid-column:1}
.opt .btn{grid-column:2;grid-row:1/span 3}
.btn{border:0;border-radius:12px;padding:12px 16px;font:700 15px var(--f-body);background:var(--mine);color:#fff;min-height:44px}
.btn:disabled{background:#cfd4d6;color:#7d878b}
.btn.buy{background:var(--gold);width:100%;font-size:17px}
.btn.gold{background:var(--gold)}
.btn:focus-visible,.close:focus-visible,.menu-btn:focus-visible,.market-btn:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.note{font-size:13px;color:var(--muted);margin:8px 0 0}
.lead{font-size:16px;font-weight:700;margin:14px 0 4px;line-height:1.4}
.bar{height:12px;background:#ece6d8;border-radius:6px;overflow:hidden;margin-top:6px}
.bar b{display:block;height:100%;background:linear-gradient(90deg,#e7c04f,var(--gold));width:0}
.bar.blue b{background:var(--mine)}
.prow{display:flex;justify-content:space-between;font-size:14px;margin-top:8px;font-variant-numeric:tabular-nums}

.pop{position:fixed;z-index:3;pointer-events:none;font:600 20px var(--f-display);color:#fff;text-shadow:0 2px 0 #8a6510,0 0 6px rgba(0,0,0,.35);transform:translate(-50%,-50%);white-space:nowrap}
.build-tag{position:fixed;z-index:3;pointer-events:none;transform:translate(-50%,-100%);background:rgba(30,42,47,.85);color:#fff;font:700 12px var(--f-body);padding:4px 9px;border-radius:8px;white-space:nowrap;font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 108px);transform:translateX(-50%);z-index:7;background:var(--ink);color:#fff;padding:8px 14px;border-radius:12px;font-size:14px;max-width:calc(100% - 32px);text-align:center}
.army{position:fixed;z-index:5;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 62px);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;pointer-events:none}
.army[hidden]{display:none}
.chip.full .v{color:var(--bad)}
.isl{position:fixed;z-index:4;left:calc(env(safe-area-inset-left,0px) + 16px);bottom:calc(env(safe-area-inset-bottom,0px) + 92px);background:rgba(30,42,47,.78);color:#fff;font:700 12px var(--f-body);padding:5px 10px;border-radius:14px;pointer-events:none}
.chip .x{display:block;font:800 9px/1.1 var(--f-body);color:var(--bad);white-space:nowrap}
.army .chip{padding:4px 6px}
.army .chip .v{font-size:14px}
@media (prefers-reduced-motion:reduce){.sheet,.chip.flash{animation:none}}
</style>

</head>
<body>
<div id="scene"></div>

<div class="hud">
  <div class="res">
    <div class="chip" id="c-odun"><i class="i-odun"></i><div><span class="v" id="r-odun">0</span><span class="l">Odun</span></div></div>
    <div class="chip" id="c-demir"><i class="i-demir"></i><div><span class="v" id="r-demir">0</span><span class="l">Demir</span></div></div>
    <div class="chip" id="c-altin"><i class="i-altin"></i><div><span class="v" id="r-altin">0</span><span class="l">Altın</span></div></div>
    <div class="chip" id="c-cimento"><i class="i-cimento"></i><div><span class="v" id="r-cimento">0</span><span class="l">Çimento</span></div></div>
  </div>
  <button class="menu-btn" id="reset" type="button">Sıfırla</button>
</div>

<div class="army" id="army" hidden></div>

<button class="world-btn" id="worldBtn" type="button" aria-label="Dünya, adalar">
  <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="16" cy="16" r="12"/><ellipse cx="16" cy="16" rx="5.2" ry="12"/><path d="M4.5 12h23M4.5 20h23"/>
  </svg>Dünya
</button>
<button class="home-btn" id="homeBtn" type="button" aria-label="Kendi adama dön" hidden>
  <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 7L5 14l7 7"/><path d="M5 14h14a8 8 0 0 1 8 8v3"/>
  </svg>Geri dön
</button>

<button class="market-btn" id="marketBtn" type="button" aria-label="Market">
  <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round">
    <path d="M5 13v14h22V13"/><path d="M3 13l3-8h20l3 8"/><path d="M3 13c0 2 1.6 3.4 3.3 3.4S9.7 15 9.7 13c0 2 1.5 3.4 3.2 3.4S16 15 16 13c0 2 1.5 3.4 3.2 3.4s3.1-1.4 3.1-3.4c0 2 1.6 3.4 3.4 3.4S29 15 29 13"/><path d="M13 27v-6h6v6"/>
  </svg>Market
</button>

<button class="army-btn" id="armyBtn" type="button" aria-label="Askeri güç" hidden>
  <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round">
    <path d="M16 3l11 4v8c0 7-4.6 11.6-11 14C9.6 26.6 5 22 5 15V7z"/><path d="M16 10l1.9 4 4.3.5-3.2 2.9.9 4.3-3.9-2.2-3.9 2.2.9-4.3-3.2-2.9 4.3-.5z"/>
  </svg>Askeri güç
</button>

<div class="hint" id="hint">Arsaya, (i) işaretine veya kilide dokun</div>
<div class="isl" id="islBadge"></div>

<div class="sheet" id="sheet" hidden>
  <div class="grab"></div>
  <div id="sheetBody"></div>
</div>
<div class="toast" id="toast" hidden></div>

<div id="errBox" hidden style="position:fixed;inset:auto 16px 110px 16px;z-index:9;background:#fff3f0;color:#7a2a1a;border:1px solid #e3b4a8;border-radius:12px;padding:12px 14px;font:600 13px/1.4 system-ui,sans-serif"></div>
<script>
window.addEventListener('error',function(e){var b=document.getElementById('errBox');if(!b)return;b.hidden=false;b.textContent='Hata: '+(e.message||'bilinmeyen')+(e.error&&e.error.stack?' | '+String(e.error.stack).split('\n').slice(0,4).join(' / ').slice(0,420):'')+(e.filename?' ('+String(e.filename).split('/').pop()+':'+e.lineno+')':'')+' — bu yazıyı bana iletin.';});
</script>
<script src="three.min.js"></script>
<script src="OrbitControls.js"></script>
<script>
function __main(){
/* ---------- Oyun kuralları ---------- */
const RES=['odun','demir','altin','cimento'];
const RES_NAME={odun:'Odun',demir:'Demir',altin:'Altın',cimento:'Çimento'};
const B={
  ev:      {name:'Müstakil Ev',     cost:1,  period:30, gain:10,  build:10, h:6.5},
  dukkan:  {name:'Tek Katlı Dükkan',cost:1,  period:40, gain:20,  build:20, h:4.6},
  apartman:{name:'Apartman',        cost:1,  period:50, gain:100, build:30, h:15.5},
  avm:     {name:'AVM',             cost:1,   period:60, gain:150, build:60, h:7.2},
  otopark: {name:'Otopark',         cost:1,  period:75, gain:300, build:45, h:8.6}
};
B.piyade={name:'Piyade Birliği',cost:1,period:0,gain:0,mil:1,build:40,h:5};
B.hava={name:'Hava Birliği',cost:1,period:0,gain:0,mil:1,build:50,h:6};
B.topcu={name:'Topçu Birliği',cost:1,period:0,gain:0,mil:1,build:45,h:4.2};
B.silah={name:'Silah Üretim Merkezi',cost:1,period:0,gain:0,mil:1,build:55,h:7};
B.gemi={name:'Savaş Gemisi Üretim Merkezi',cost:1,period:0,gain:0,mil:1,build:70,h:5.5};
B.depoAltin={name:'Altın Deposu',cost:1,period:0,gain:0,depo:'altin',build:20,h:5};
B.depoOdun={name:'Odun Deposu',cost:1,period:0,gain:0,depo:'odun',build:20,h:5};
B.depoDemir={name:'Demir Deposu',cost:1,period:0,gain:0,depo:'demir',build:20,h:5};
B.depoCimento={name:'Çimento Deposu',cost:1,period:0,gain:0,depo:'cimento',build:20,h:5};
// Bölge 5: şimdilik işlevsiz binalar (stub), özellikleri ileride eklenecek
B.nukleer={name:'Nükleer Füze Üretim Tesisi',cost:1,period:0,gain:0,mil:1,build:60,h:10};
B.ucaksavar={name:'Uçaksavar Üretim Tesisi',cost:1,period:0,gain:0,stub:1,build:45,h:6};
B.havalimani={name:'Müttefik Havalimanı',cost:1,period:0,gain:0,stub:1,build:60,h:8};
B.karargah={name:'Müttefik Ordu Karargahı',cost:1,period:0,gain:0,stub:1,build:50,h:9};
B.satis={name:'Uluslararası Satış Ofisi',cost:1,period:0,gain:0,stub:1,build:40,h:12};
const ZONING=[['ev','apartman'],['dukkan','avm','otopark'],['piyade','hava','topcu','silah','gemi'],['depoAltin','depoOdun','depoDemir','depoCimento'],['nukleer','ucaksavar','havalimani','karargah','satis']];
const KIND=['Konut imarlı','Ticari imarlı','Askeri bölge (kıyı)','Depo bölgesi','Stratejik bölge'];
const ZI=[null,
  {t:'Ticari Bölge',f:['Tek Katlı Dükkan','AVM','Otopark'],n:'Tüm arsalar ticari imarlıdır; konut yapılamaz.'},
  {t:'Askeri Bölge · denize sıfır',f:['Arsa 21 · Savaş Gemisi Üretim Merkezi (denize sıfır)','Arsa 22 · Piyade Birliği','Arsa 23 · Hava Birliği','Arsa 24 · Topçu Birliği','Arsa 25 · Silah Üretim Merkezi'],n:'Bu bölgede 10 değil 5 alan var, her bina için ayrı bir alan. Bu binalar altın vermez, asker üretimi içindir.'},
  {t:'Depo Bölgesi',f:['Arsa 31 · Altın Deposu','Arsa 32 · Odun Deposu','Arsa 33 · Demir Deposu','Arsa 34 · Çimento Deposu'],n:'Bu bölgede 4 alan var, her depo için ayrı bir alan. Seviye 1 kapasitesi her kaynaktan 2.000, her seviyede 2.000 artar, en fazla seviye 10 (20.000). Kapasite üstündeki fazla kaynak saldırılarda yağmalanabilir.'},
  {t:'Stratejik Bölge',f:['Arsa 41 · Nükleer Füze Üretim Tesisi','Arsa 42 · Uçaksavar Üretim Tesisi','Arsa 43 · Müttefik Havalimanı','Arsa 44 · Müttefik Ordu Karargahı','Arsa 45 · Uluslararası Satış Ofisi'],n:'Bu bölgede 5 alan var, her bina için ayrı bir alan. Şimdilik bu binaların işlevi yok, sadece kurulum yapılır. Özellikleri ileride eklenecek.'}];
const hasB=k=>S.plots.slice(0,50).some(p=>p.b&&p.b.type===k); // her askeri bina A1'de 1 tane; ele geçirilen adalarda sınır yok
const FIXED={20:'gemi',21:'piyade',22:'hava',23:'topcu',24:'silah',30:'depoAltin',31:'depoOdun',32:'depoDemir',33:'depoCimento',40:'nukleer',41:'ucaksavar',42:'havalimani',43:'karargah',44:'satis'};
// Ele geçirilen adalar: 34 arsa = 33 serbest arsa (hücre) + 1 kıyı arsası (sadece Savaş Gemisi Üretim Merkezi)
const ISL_PLOTS=34, CAPTURE_COST=100000, ISL_GRID=[-35,-21,-7,7,21,35], ISL_COAST=[49,0];
const ISL_CELLS=[]; ISL_GRID.forEach(gz=>ISL_GRID.forEach(gx=>{ if(!((gx===-35&&gz===-35)||(gx===35&&gz===-35)||(gx===35&&gz===35))) ISL_CELLS.push([gx,gz]); }));
const islOfPlot=i=>{ if(i<50)return 1; for(const k of Object.keys(S.isl)){const b=S.isl[k].base; if(i>=b&&i<b+ISL_PLOTS)return +k;} return 0; };
const isCoastPlot=i=>i>=50&&(i-S.isl[islOfPlot(i)].base)===ISL_PLOTS-1;
const plotTitle=i=>i<50?'Arsa '+(i+1):islandName(islOfPlot(i))+' · Arsa '+(i-S.isl[islOfPlot(i)].base+1);
const plotKind=i=>i<50?KIND[zoneOf(i)]:(isCoastPlot(i)?'Kıyı (sadece Savaş Gemisi Üretim Merkezi)':'Serbest imar (her bina)');
const plotZone=i=>i<50?ZONES[zoneOf(i)].name:'Ada '+islandName(islOfPlot(i));
const allowed=i=>{ if(i>=50) return isCoastPlot(i)?['gemi']:Object.keys(B).filter(k=>k!=='gemi'); return FIXED[i]?[FIXED[i]]:ZONING[zoneOf(i)]; };
// Askeri üretim: her birlik kendi binasında üretilir (bina anahtarı = birlik anahtarı)
const UNITS={
  piyade:{name:'Piyade',cost:1,dur:10,ammo:0,carry:10},
  hava:{name:'Helikopter / İHA',cost:3,dur:25,ammo:1,carry:20},
  topcu:{name:'Topçu / Tank',cost:4,dur:30,ammo:0,carry:5},
  gemi:{name:'Savaş Gemisi',cost:6,dur:40,ammo:2,carry:50}
};
const silahReady=()=>S.plots.some(p=>p.b&&p.b.type==='silah'&&p.b.done);
// Depolar: seviye başına 2.000 kapasite, en fazla seviye 10. Depo kurulmadıysa o kaynakta limit yok.
const LVL_CAP=2000, MAX_LVL=10, UPG_COST=1; // UPG_COST: test için her kaynaktan 1
const depoOf=r=>S.plots.find(p=>p.b&&p.b.done&&p.b.type==='depo'+r[0].toUpperCase()+r.slice(1));

  const dx=x2-x1, dz=z2-z1, L=Math.hypot(dx,dz);
  const g=new THREE.Group(); g.position.set((x1+x2)/2,0,(z1+z2)/2); g.rotation.y=-Math.atan2(dz,dx);

}

// ---- saldırı planı: hedefler fırlatma anında belirlenir, hasar isabet anında uygulanır
function planStrike(n,k,cnt,target){
  const foe=S.foe[n]||(S.foe[n]={hit:{},log:[],dead:{}}), dead=foe.dead||(foe.dead={});
  const taken=new Set(), ms=[], areas=Object.keys(FOE_CAT);
  const alive=cat=>FOE_LAYOUT.map((t,j)=>j).filter(j=>!dead[j]&&!taken.has(j)&&(!cat||FOE_CAT[cat].includes(FOE_LAYOUT[j])));
  for(let m=0;m<cnt;m++){
    let area=target;
    if(area==='rastgele'){ const ok=areas.filter(a=>alive(a).length); area=ok.length?ok[Math.floor(Math.random()*ok.length)]:areas[Math.floor(Math.random()*areas.length)]; }
    const cand=alive(area); let kill=[], aim;
    if(k==='fuze_sup') kill=cand.slice();                                    // süpersonik: bölgedeki tüm binalar
    else if(cand.length) kill=[cand[Math.floor(Math.random()*cand.length)]]; // saldırı füzesi: bir bina
    kill.forEach(j=>taken.add(j));
    if(kill.length) aim=kill[Math.floor(kill.length/2)];
    else { const all=FOE_LAYOUT.map((t,j)=>j).filter(j=>FOE_CAT[area].includes(FOE_LAYOUT[j])); aim=all[Math.floor(Math.random()*all.length)]; }
    ms.push({aim,kill,area,delay:(m%12)*0.8,vis:m<12,hit:false});
  }
  return ms;
}
function launchStrike(n,k,cnt,target){
  if(!S.strikes) S.strikes=[];
  S.strikes.push({id:Date.now()+'_'+Math.floor(Math.random()*1e6),n,k,cnt,target,t0:Date.now(),ms:planStrike(n,k,cnt,target),logged:false});
  save();
}
function mPos(el,s,m){
  const hp=POS[40]||[0,0], sy=(B.nukleer.h||10)+1, c=foeCell(s.n,m.aim), ty=(B[FOE_LAYOUT[m.aim]]||{h:4}).h+1;
  let h,y;
  if(el<T_CLIMB){ const u=el/T_CLIMB; h=0.02*u*u; y=sy+(APEX-sy)*(1-(1-u)*(1-u)); }
  else if(el<T_CRUISE){ const u=(el-T_CLIMB)/(T_CRUISE-T_CLIMB); h=0.02+0.78*u*u*(3-2*u); y=APEX; }
  else { const u=Math.min(1,(el-T_CRUISE)/(T_FLIGHT-T_CRUISE)); h=0.8+0.2*u*u; y=APEX+(ty-APEX)*u*u; }
  return [hp[0]+(c[0]-hp[0])*h,y,hp[1]+(c[1]-hp[1])*h];
}
// ---- harabe: yıkılan bina yanan enkaza dönüşür
function makeRuin(type,seed){
  const r=rng(seed*977+31), [w,d,zo,h]=FOOT[type]||[7,6,0,5], g=new THREE.Group(), y0=0.38;
  const cols=[0x2b2623,0x3a312c,0x544539,0x1c1917,0x6b5a4a].map(c=>pm(c,0.95,0));
  const slab=box(w+0.6,0.3,d+0.6,cols[3],0,y0+0.12,zo); slab.castShadow=false; g.add(slab);
  for(let i=0;i<16;i++){ const sw=0.5+r()*1.5, sh=0.3+r()*1.1, sd=0.5+r()*1.5;
    const b=box(sw,sh,sd,cols[Math.floor(r()*5)],(r()-0.5)*(w-0.6),y0+0.25+sh/2,zo+(r()-0.5)*(d-0.6)); b.rotation.set((r()-0.5)*0.6,r()*3.14,(r()-0.5)*0.6); g.add(b); }
  [[-1,-1],[1,-1],[1,1],[-1,1]].forEach(([a,c],i)=>{ if(r()<0.25)return;
    const wh=h*(0.18+r()*0.35), ww=w*(0.25+r()*0.3);
    const wl=box(ww,wh,0.45,cols[i%2?1:4],a*(w/2-ww/2),y0+0.3+wh/2,zo+c*(d/2-0.2)); wl.rotation.z=(r()-0.5)*0.12; g.add(wl);
    const cap=box(ww*0.5,wh*0.35,0.5,cols[0],a*(w/2-ww/2)+ww*0.2,y0+0.3+wh*1.05,zo+c*(d/2-0.2)); cap.rotation.z=(r()-0.5)*0.5; g.add(cap); });
  for(let i=0;i<4;i++){ const bm=box(0.25,0.25,2.5+r()*2.5,cols[0],(r()-0.5)*w*0.7,y0+0.8+r()*0.8,zo+(r()-0.5)*d*0.6); bm.rotation.set((r()-0.5)*0.9,r()*3.14,(r()-0.5)*0.9); g.add(bm); }
  try{ mergeStatic(g); }catch(e){}
  const flames=[], smoke=[];
  const fm1=new THREE.MeshBasicMaterial({color:0xff6a1a,transparent:true,opacity:0.9,depthWrite:false}), fm2=new THREE.MeshBasicMaterial({color:0xffd24a,transparent:true,opacity:0.95,depthWrite:false});
  for(let i=0;i<4;i++){ const fl=new THREE.Group(); fl.position.set((r()-0.5)*w*0.7,y0+0.6,zo+(r()-0.5)*d*0.7);
    const c1=new THREE.Mesh(new THREE.ConeGeometry(0.75,2.2,7),fm1); c1.position.y=1.1; const c2=new THREE.Mesh(new THREE.ConeGeometry(0.4,1.4,6),fm2); c2.position.y=0.7;
    fl.add(c1,c2); c1.userData.fx=1; c2.userData.fx=1; fl.userData.ph=r()*6; g.add(fl); flames.push(fl); }
  for(let i=0;i<3;i++){ const s=new THREE.Mesh(sph(),new THREE.MeshBasicMaterial({color:0x3b3b3b,transparent:true,opacity:0.5,depthWrite:false})); s.userData.fx=1; g.add(s); smoke.push(s); }
  return {g,flames,smoke,zo};
}
function setRuin(n,j,anim){
  const f=foeObjs[n]; if(!f||!f.built||f.ruin[j])return; const it=f.items[j]; if(!it)return;
  it.b.visible=false;
  const [x,z,rot]=foeCell(n,j), t=FOE_LAYOUT[j], R=makeRuin(t,j+1);
  R.g.position.set(x,0,z); R.g.rotation.y=rot; f.bld.add(R.g);
  R.g.traverse(o=>{ if(o.isMesh&&!o.userData.fx){o.userData.foeb=j; o.userData.ruin=1; foePick.push(o);} });
  f.ruin[j]=R;
  if(anim&&f.bld.visible){ const hh=(B[t]?B[t].h:5); addFx('boom',x,hh*0.5,z,1.5,1.0,12,0xffa63a,0.95); addFx('boom',x,hh*0.4,z,1,0.5,8,0xfff3c4,1);
    for(let q=0;q<4;q++) addFx('puff',x+(Math.random()-0.5)*5,hh*0.4,z+(Math.random()-0.5)*5,1.4,2.2,3,0x555555,0.7); }
}
function clearRuins(n){
  const f=foeObjs[n]; if(!f)return;
  Object.keys(f.ruin).forEach(j=>{ f.bld.remove(f.ruin[j].g); if(f.items[j]) f.items[j].b.visible=true; }); f.ruin={};
  for(let i=foePick.length-1;i>=0;i--) if(foePick[i].userData.ruin) foePick.splice(i,1);
}
// ---- isabet çözümü (gerçek zamanlı, oyun kapalıyken de ilerler)
function resolveStrikes(now){
  if(!S.strikes||!S.strikes.length)return; let changed=false;
  S.strikes.forEach(s=>{
    s.ms.forEach(m=>{
      if(m.hit)return; const el=(now-s.t0)/1000-m.delay; if(el<T_FLIGHT)return;
      m.hit=true; changed=true;
      const foe=S.foe[s.n]||(S.foe[s.n]={hit:{},log:[],dead:{}}); if(!foe.dead) foe.dead={};
      m.kill.forEach(j=>{ foe.dead[j]=1; setRuin(s.n,j,el-T_FLIGHT<4); });
    });
    if(!s.logged&&s.ms.every(m=>m.hit)){
      s.logged=true; const foe=S.foe[s.n], names={}; let tot=0;
      s.ms.forEach(m=>m.kill.forEach(j=>{tot++; const nm=B[FOE_LAYOUT[j]].name; names[nm]=(names[nm]||0)+1;}));
      const txt=tot?Object.keys(names).map(x=>names[x]+' '+x).join(', '):'hedefte yıkılacak bina kalmamıştı';
      const line=`${s.cnt} ${MIS[s.k].name} · ${FOE_CAT_NAME[s.target]}: ${tot} bina yıkıldı${tot?' ('+txt+')':' — '+txt}`;
      (foe.log=foe.log||[]).unshift(line); foe.log.length=Math.min(foe.log.length,8);
      if((now-s.t0)/1000<T_FLIGHT+s.ms.length*0.8+12) toast('İsabet: '+line);
    }
  });
  S.strikes=S.strikes.filter(s=>!s.logged);
  if(changed){ save(); if(mode&&mode.t==='island'&&FOE[parseIsland(mode.n)]) renderSheet(); }
}
function updateMissiles(dt){
  const now=Date.now(), live={};
  (S.strikes||[]).forEach(s=>{ s.ms.forEach((m,i)=>{
    if(m.hit||!m.vis)return; const el=(now-s.t0)/1000-m.delay; if(el<0||el>=T_FLIGHT)return;
    const key=s.id+'_'+i; live[key]=1; let o=mesh3[key];
    if(!o){ o={mesh:makeMissile(s.k==='fuze_sup'?1.8:1.4),trail:0}; fxG.add(o.mesh); mesh3[key]=o; }
    const p=mPos(el,s,m), p2=mPos(el+0.15,s,m);
    o.mesh.position.set(p[0],p[1],p[2]);
    const dir=new THREE.Vector3(p2[0]-p[0],p2[1]-p[1],p2[2]-p[2]);
    if(dir.lengthSq()>1e-8){ dir.normalize(); o.mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),dir); }
    o.trail-=dt; if(o.trail<=0){ const lift=el<T_CLIMB; o.trail=lift?0.03:0.07;
      addFx('puff',p[0],p[1],p[2],lift?1.3:0.6,lift?2.0:1.2,2,el<2?0xffb050:(lift?0xf2e6d0:0xeeeeee),0.75); }
  }); });
  Object.keys(mesh3).forEach(k=>{ if(!live[k]){ fxG.remove(mesh3[k].mesh); delete mesh3[k]; } });
  for(let q=fxs.length-1;q>=0;q--){
    const e=fxs[q]; e.t+=dt; const u=e.t/e.life;
    if(u>=1){fxG.remove(e.m); e.m.material.dispose(); fxs.splice(q,1); continue;}
    if(e.kind==='puff'){ e.m.scale.setScalar(e.s0*(1+u*e.grow)); e.m.material.opacity=e.op*(1-u); }
    else { e.m.scale.setScalar(e.s0+e.grow*u); e.m.material.opacity=e.op*(1-u*u); }
  }
  const tt=performance.now()/1000;
  Object.keys(foeObjs).forEach(k=>{
    const f=foeObjs[k]; if(!f.built||!f.bld.visible)return;
    Object.keys(f.ruin).forEach(j=>{ const R=f.ruin[j];
      R.flames.forEach(fl=>{ const p=fl.userData.ph; fl.scale.set(1+0.15*Math.sin(tt*11+p),0.8+0.45*Math.sin(tt*8+p*2)+0.2*Math.sin(tt*17+p),1+0.15*Math.cos(tt*10+p)); });
      R.smoke.forEach((m,i)=>{ const u=((tt*0.4+i/3)%1); m.position.set(Math.sin(tt+i)*0.8,2.5+u*8,Math.cos(tt+i)*0.8+R.zo); m.scale.setScalar(1.0+u*2.6); m.material.opacity=0.5*(1-u); });
    });
  });
}

/* ---------- Bina kalitesi: doku, malzeme, geometri birleştirme ---------- */
const TXC={}, PMC={};
// Hafif malzeme: telefon ve zayıf ekran kartlarında 3B bağlamının düşmemesi için Lambert kullanılır
function stdMat(o){ const q=Object.assign({},o); delete q.roughness; delete q.metalness; delete q.envMapIntensity; return new THREE.MeshLambertMaterial(q); }
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function shade(hex,f){const c=v=>Math.max(0,Math.min(255,v*f))|0;return 'rgb('+c((hex>>16)&255)+','+c((hex>>8)&255)+','+c(hex&255)+')';}
function ctex(key,w,h,draw){
  if(TXC[key])return TXC[key];
  const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');
  let sd=0; for(let i=0;i<key.length;i++) sd=(sd*31+key.charCodeAt(i))|0;
  draw(x,w,h,rng(sd));
  const t=new THREE.CanvasTexture(c); t.wrapS=t.wrapT=THREE.RepeatWrapping;
  t.anisotropy=Math.min(4,renderer.capabilities.getMaxAnisotropy()); return TXC[key]=t;
}
function pm(c,rough,metal){const k=c+'_'+rough+'_'+metal; return PMC[k]||(PMC[k]=stdMat({color:c,roughness:rough===undefined?0.85:rough,metalness:metal||0,envMapIntensity:(metal||0)>0.3?1:0.3}));}
function tmat(tex,rough,metal,color){const k='t'+tex.uuid+'_'+rough+'_'+metal+'_'+color; return PMC[k]||(PMC[k]=stdMat({map:tex,color:color===undefined?0xffffff:color,roughness:rough===undefined?0.85:rough,metalness:metal||0,envMapIntensity:(metal||0)>0.3?1:0.3}));}
const GLASS=stdMat({color:0x8fc1d9,roughness:0.1,metalness:0.5,emissive:0x1b3a4d,emissiveIntensity:0.45});
const GLASS_LIT=stdMat({color:0xffe2a0,roughness:0.3,metalness:0,emissive:0xd8a64a,emissiveIntensity:0.55});
const GABLE_M={};
function gableMat(c){return GABLE_M[c]||(GABLE_M[c]=stdMat({color:c,roughness:0.9,side:THREE.DoubleSide}));}

function tbox(w,h,d,m,x,y,z,uw,uh){
  const geo=new THREE.BoxGeometry(w,h,d), uv=geo.attributes.uv;
  const face=[[d,h],[d,h],[w,d],[w,d],[w,h],[w,h]];
  for(let f=0;f<6;f++){
    const sx=face[f][0]/uw, sy=face[f][1]/((f===2||f===3)?uw:(uh||uw));
    for(let v=0;v<4;v++){const i=f*4+v; uv.setXY(i,uv.getX(i)*sx,uv.getY(i)*sy);}
  }
  const mesh=new THREE.Mesh(geo,m); mesh.position.set(x||0,y||0,z||0); mesh.castShadow=true; mesh.receiveShadow=true; return mesh;
}

// Aynı malzemeli parçaları tek ağda birleştirir: çizim sayısı düşer, telefonda akıcı kalır
function mergeStatic(g){
  g.updateMatrixWorld(true);
  const B=new Map(), meshes=[]; g.traverse(o=>{if(o.isMesh)meshes.push(o);});
  const v=new THREE.Vector3(), nm=new THREE.Matrix3();
  meshes.forEach(o=>{
    const geo=o.geometry; if(!geo.index||!geo.attributes.normal) return;
    nm.getNormalMatrix(o.matrixWorld);
    const multi=Array.isArray(o.material), groups=multi?geo.groups:[{start:0,count:geo.index.count,materialIndex:0}];
    groups.forEach(gr=>{
      const m=multi?o.material[gr.materialIndex]:o.material, key=m.uuid+(o.castShadow?'c':'n');
      let b=B.get(key); if(!b){b={m,cast:o.castShadow,pos:[],nor:[],uv:[],idx:[]};B.set(key,b);}
      const remap=new Map();
      for(let i=gr.start;i<gr.start+gr.count;i++){
        const vi=geo.index.getX(i); let ni=remap.get(vi);
        if(ni===undefined){
          ni=b.pos.length/3; remap.set(vi,ni);
          v.fromBufferAttribute(geo.attributes.position,vi).applyMatrix4(o.matrixWorld); b.pos.push(v.x,v.y,v.z);
          v.fromBufferAttribute(geo.attributes.normal,vi).applyMatrix3(nm).normalize(); b.nor.push(v.x,v.y,v.z);
          if(geo.attributes.uv) b.uv.push(geo.attributes.uv.getX(vi),geo.attributes.uv.getY(vi)); else b.uv.push(0,0);
        }
        b.idx.push(ni);
      }
    });
  });
  meshes.forEach(o=>{ if(!o.geometry.index||!o.geometry.attributes.normal) return; if(o.parent)o.parent.remove(o); o.geometry.dispose(); });
  B.forEach(b=>{
    const geo=new THREE.BufferGeometry();
    geo.setAttribute('position',new THREE.Float32BufferAttribute(b.pos,3));
    geo.setAttribute('normal',new THREE.Float32BufferAttribute(b.nor,3));
    geo.setAttribute('uv',new THREE.Float32BufferAttribute(b.uv,2));
    geo.setIndex(b.pos.length/3>65000?new THREE.Uint32BufferAttribute(b.idx,1):new THREE.Uint16BufferAttribute(b.idx,1));
    const mesh=new THREE.Mesh(geo,b.m); mesh.castShadow=b.cast; mesh.receiveShadow=true; g.add(mesh);
  });
}

function createPlot(i){
  const [x,z]=POS[i];
  const g=new THREE.Group(); g.position.set(x,0,z); g.rotation.y=PROT[i];
  const edge=box(10.4,0.3,10.4,M_MUNI_EDGE,0,0.15,0); edge.castShadow=false;
  const top=box(9.6,0.36,9.6,M_MUNI_TOP,0,0.2,0); top.castShadow=false;
  g.add(edge,top);
  [[-4.9,-4.9],[4.9,-4.9],[-4.9,4.9],[4.9,4.9]].forEach(([a,b])=>g.add(box(0.25,1,0.25,mat(0xf4efe4),a,0.5,b)));
  const sprite=new THREE.Sprite(new THREE.SpriteMaterial({map:TEX_MUNI,depthTest:false}));
  sprite.scale.set(2.6,2.6,1); sprite.position.set(0,2.6,0); sprite.renderOrder=10;
  g.add(sprite);
  [edge,top,sprite].forEach(o=>{o.userData.plot=i;pickables.push(o);});
  (i<50?world:(islGroups[islOfPlot(i)]||world)).add(g);
  plotObj[i]={g,edge,top,sprite,building:null};
  const p=S.plots[i]; if(p.b){ if(p.b.done) placeBuilding(i,p.b.type,false); else startSite(i); }
  paintPlot(i);
}

const v4=new THREE.Vector3();
function updateSites(t){
  const now=Date.now();
  Object.keys(sites).forEach(k=>{
    const s=sites[k], i=+k, p=S.plots[i]; if(!p.b) return;
    const dur=B[p.b.type].build*1000, u=Math.max(0,Math.min(1,(now-p.b.start)/dur));
    const c=0.4+u*s.h;
    s.plane.constant=c; s.plane2.constant=Math.min(s.h+1.4,c+2.6);
    s.edge.position.y=c; s.edge.visible=u<0.995;
    s.jib.rotation.y=s.a0+Math.sin(t/2500+i)*0.5;
    s.trolley.position.x=6+Math.sin(t/1700+i)*2;
    const lo=c+1.5, hi=s.ch-2, hy=lo+(Math.sin(t/1300+i)*0.5+0.5)*Math.max(0,hi-lo);
    const drop=Math.max(1,s.ch-hy); s.hook.position.y=-drop; s.cable.scale.y=drop; s.cable.position.y=-drop/2;
    s.ws[0].position.x=Math.sin(t/900+i)*2.2; s.ws[0].rotation.y=Math.cos(t/900+i)>0?Math.PI/2:-Math.PI/2;
    s.ws[1].position.z=s.zo+Math.sin(t/1100+i)*2; s.ws[1].rotation.y=Math.cos(t/1100+i)>0?0:Math.PI;
    s.ws[2].position.x=Math.sin(t/1300+i)*1.2;
    s.dust.forEach((d,n)=>{d.material.opacity=0.3+0.2*Math.sin(t/400+n*2); d.position.y=0.8+((t/1000+n)%2)*0.6;});
    const rem=Math.max(0,Math.ceil((dur-(now-p.b.start))/1000));
    s.label.textContent=`İnşaat %${Math.floor(u*100)} · ${rem} sn`;
    v4.set(POS[i][0],s.ch+1.2,POS[i][1]).project(camera);
    s.label.style.left=((v4.x+1)/2*innerWidth)+'px'; s.label.style.top=((1-v4.y)/2*innerHeight)+'px';
    s.label.hidden=v4.z>1||!(plotObj[i]&&isVis(plotObj[i].g));
  });
}

// Her üretim döngüsünde altın üreten bina, altın deposuna giden bir kamyon çıkarır. Sadece görsel: altın üretildiği anda zaten hesaba eklenir.
const TRUCK_MAX=12, TRUCK_SPEED=15;
const truckGroup=new THREE.Group(); scene.add(truckGroup);
const trucks=[];
const TM={body:mat(0xd8741a),cab:mat(0x1f6fd6),glass:mat(0x9fd3e8),wheel:mat(0x1b1d1f),gold:mat(0xe3b02a),bed:mat(0x6b6f72)};
function makeTruck(){
  const g=new THREE.Group();
  g.add(box(3.2,0.4,1.7,TM.bed,-0.6,0.75,0));          // kasa tabanı
  g.add(box(3.0,0.1,1.7,TM.body,-0.6,0.95,0));
  [-0.84,0.84].forEach(z=>g.add(box(3.0,0.55,0.1,TM.body,-0.6,1.25,z)));
  g.add(box(0.1,0.55,1.7,TM.body,-2.15,1.25,0));
  g.add(box(2.2,0.45,1.3,TM.gold,-0.7,1.2,0));         // altın yükü
  g.add(box(1.1,0.35,0.9,TM.gold,-0.7,1.55,0));
  g.add(box(1.3,1.1,1.7,TM.cab,1.55,1.1,0));           // kabin
  g.add(box(0.1,0.5,1.4,TM.glass,2.22,1.35,0));
  [[1.5,0.82],[1.5,-0.82],[-1.3,0.82],[-1.3,-0.82],[-2.0,0.82],[-2.0,-0.82]].forEach(([x,z])=>{
    const w=new THREE.Mesh(new THREE.CylinderGeometry(0.4,0.4,0.3,10),TM.wheel); w.rotation.x=Math.PI/2; w.position.set(x,0.4,z); g.add(w);
  });
  g.scale.setScalar(0.75);
  return g;
}
function truckRoute(i,di){
  const zc=ZONES[zoneOf(i)].c[1], [px,pz]=POS[i], [dx,dz]=POS[di], side=px>=0?34:-34;
  const dzc=ZONES[zoneOf(di)].c[1];
  const a=pz>=zc?1:-1, b=dz>=dzc?1:-1;
  return [[px,zc+a*3.2],[px,zc],[side,zc],[side,dzc],[dx,dzc],[dx,dzc+b*3.2]];
}
function spawnTruck(i,amt){
  if(viewN!==1||worldView||document.hidden||trucks.length>=TRUCK_MAX||i>=50) return;
  const di=S.plots.findIndex((q,k)=>k>=30&&k<34&&q.b&&q.b.done&&q.b.type==='depoAltin'); if(di<0) return;
  const pts=truckRoute(i,di), m=makeTruck(); m.position.set(pts[0][0],0.05,pts[0][1]); m.scale.setScalar(0.01); truckGroup.add(m);
  trucks.push({m,pts,k:1,amt,di,age:0,ang:null});
}
function updateTrucks(dt){
  truckGroup.visible=(viewN===1);
  for(let q=trucks.length-1;q>=0;q--){
    const t=trucks[q]; t.age+=dt;
    const last=t.k>=t.pts.length;
    const sc=Math.min(1,t.age/0.35)*(last?Math.max(0,1-(t.age-t.endAt)/0.35):1)*0.75; t.m.scale.setScalar(Math.max(0.01,sc));
    if(last){ if(t.age-t.endAt>=0.35){truckGroup.remove(t.m); t.m.traverse(o=>{if(o.geometry)o.geometry.dispose();}); trucks.splice(q,1);} continue; }
    const tg=t.pts[t.k], p=t.m.position, dx=tg[0]-p.x, dz=tg[1]-p.z, d=Math.hypot(dx,dz), st=TRUCK_SPEED*dt;
    const want=-Math.atan2(dz,dx);
    if(t.ang===null) t.ang=want;
    let da=want-t.ang; da=Math.atan2(Math.sin(da),Math.cos(da)); t.ang+=da*Math.min(1,dt*8); t.m.rotation.y=t.ang;
    if(d<=st){p.x=tg[0];p.z=tg[1];t.k++; if(t.k>=t.pts.length){t.endAt=t.age; popup(t.di,'+'+t.amt+' altın');}}
    else{p.x+=dx/d*st;p.z+=dz/d*st;}
  }
}
function tick(){
  const now=Date.now(); resolveStrikes(now); let gold=false, built=false, army=false;
  S.plots.forEach((p,i)=>{
    if(!p.b)return; const d=B[p.b.type], per=d.period*1000;
    if(!p.b.done){
      const end=p.b.start+d.build*1000; if(now<end) return;
      p.b.done=true; p.b.last=end; finishSite(i); built=true;
      if(plotObj[i]){popup(i,'Tamamlandı!'); toast(d.gain?`${d.name} tamamlandı, gelir başladı`:`${d.name} tamamlandı`);}
    }
    if(d.ammo&&now-p.b.last>=per){const n=Math.floor((now-p.b.last)/per); S.ammo+=n*d.ammo; p.b.last+=n*per; army=true; if(plotObj[i])popup(i,'+'+(n*d.ammo)+' mühimmat');}
    if(p.b.prod){const u=PROD[pkey(p.b)], pr=p.b.prod, n=pr.n||1, k=Math.min(n,Math.floor((now-pr.start)/(u.dur*1000))), add=k-(pr.done||0);
      if(add>0){ if(p.b.type==='silah') S.ammo+=add; else S.units[pkey(p.b)]=(S.units[pkey(p.b)]||0)+add; pr.done=k; army=true; if(plotObj[i])popup(i,'+'+add+' '+u.name); }
      if(k>=n) p.b.prod=null; }
    if(d.gain&&now-p.b.last>=per){const n=Math.floor((now-p.b.last)/per); addRes('altin',n*d.gain); p.b.last+=n*per; gold=true; spawnTruck(i,n*d.gain); if(plotObj[i])popup(i,'+'+(n*d.gain)+' altın');}
  });
  if(gold||built||army){
    renderHUD(); renderArmy(); if(gold) flash('altin'); save();
    if(mode&&(mode.t==='market'||(mode.t==='army'&&army)||(mode.t==='plot'&&(!S.plots[mode.i].b||built||army)))) renderSheet();
  }
}

  sun.target.position.copy(controls.target); sun.position.set(controls.target.x+30,70,controls.target.z+25);
  controls.update();
  const t=performance.now();
  for(let k=growing.length-1;k>=0;k--){const g=growing[k],u=Math.min(1,(t-g.t0)/700);g.b.scale.y=0.01+0.99*(1-Math.pow(1-u,3));if(u>=1)growing.splice(k,1);}
  for(let k=fading.length-1;k>=0;k--){
    const f=fading[k].f,u=Math.min(1,(t-fading[k].t0)/1200);
    f.g.traverse(o=>{if(o.material){o.material.transparent=true;if(o.userData.o0===undefined)o.userData.o0=o.material.opacity;o.material.opacity=o.userData.o0*(1-u);}});
    f.lock.position.y=11+u*6;
    if(u>=1){world.remove(f.g);fading.splice(k,1);}
  }
  updateSites(t);
  try{ const _dt=Math.min(0.1,(t-(frameBody.lt||t))/1000); updateTrucks(_dt); updateMissiles(_dt); }catch(e){ reportErr('kamyon',e); trucks.length=0; } frameBody.lt=t;
  plotObj.forEach((o,i)=>{if(!o)return;const b=S.plots[i].b;o.sprite.position.y=(b?B[b.type].h+1.6:2.6)+Math.sin(t/600+i)*0.25;});
  fogObj.forEach((f,zi)=>{if(!f)return;
    f.lock.position.y=11+Math.sin(t/800+zi)*0.5;
    f.puffs.forEach((s,k)=>{s.position.x=s.userData.base.x+Math.sin(t/3000+k)*1.5;});
  });
  for(let k=pops.length-1;k>=0;k--){
    const p=pops[k],u=(t-p.t0)/1400; if(u>=1){p.el.remove();pops.splice(k,1);continue;}
    const b=S.plots[p.i].b; v3.set(POS[p.i][0],(b?B[b.type].h:3)+2+u*3,POS[p.i][1]).project(camera);
    p.el.style.left=((v3.x+1)/2*innerWidth)+'px'; p.el.style.top=((1-v3.y)/2*innerHeight)+'px'; p.el.style.opacity=(v3.z<1&&plotObj[p.i]&&isVis(plotObj[p.i].g))?String(1-u*u):'0';
  }
  renderer.render(scene,camera);
}

addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});

/* ---------- Başlat ---------- */
buildWorld();
renderHUD(); renderArmy();
checkUnlocks();
tick();
setInterval(()=>{tick();updateProgress();},250);
renderer.setAnimationLoop(frame);
}
try{ __main(); }catch(e){ var __b=document.getElementById('errBox'); if(__b&&!(e&&e.message==='WebGL yok')){ __b.hidden=false; __b.textContent='Başlangıç hatası: '+(e&&e.message)+' | '+String((e&&e.stack)||'').split('\n').slice(0,4).join(' / ').slice(0,420); } }
